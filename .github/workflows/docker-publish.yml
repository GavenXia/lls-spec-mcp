name: Docker Image CI/CD

# 触发条件
on:
  # 推送标签时触发
  push:
    tags:
      - 'v*.*.*'
  # 推送到 main 分支时触发
  push:
    branches:
      - main
  # 手动触发
  workflow_dispatch:

# 环境变量
env:
  DOCKER_USERNAME: gavinxia  # 替换为你的 Docker Hub 用户名
  IMAGE_NAME: spec-workflow-mcp

jobs:
  # =============================================================================
  # Job 1: 构建和推送 Docker 镜像
  # =============================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      # -------------------------------------------------------------------------
      # 1. 检出代码
      # -------------------------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      # -------------------------------------------------------------------------
      # 2. 提取元数据（版本号、标签等）
      # -------------------------------------------------------------------------
      - name: 🏷️ Extract metadata
        id: meta
        run: |
          # 从 package.json 获取版本号
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # 如果是标签触发，使用标签版本
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          
          # 设置镜像标签
          TAGS="${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${VERSION}"
          TAGS="${TAGS},${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          
          # 如果是主分支，添加 edge 标签
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            TAGS="${TAGS},${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:edge"
          fi
          
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
      
      # -------------------------------------------------------------------------
      # 3. 设置 QEMU（用于多架构构建）
      # -------------------------------------------------------------------------
      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      # -------------------------------------------------------------------------
      # 4. 设置 Docker Buildx
      # -------------------------------------------------------------------------
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # -------------------------------------------------------------------------
      # 5. 登录 Docker Hub
      # -------------------------------------------------------------------------
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      # -------------------------------------------------------------------------
      # 6. 构建并推送多架构镜像
      # -------------------------------------------------------------------------
      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=Spec-Workflow MCP Server
            org.opencontainers.image.description=MCP server for spec-driven development workflow
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # -------------------------------------------------------------------------
      # 7. 生成镜像 SBOM（软件物料清单）
      # -------------------------------------------------------------------------
      - name: 📋 Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json
      
      # -------------------------------------------------------------------------
      # 8. 扫描镜像漏洞
      # -------------------------------------------------------------------------
      - name: 🔍 Scan image for vulnerabilities
        uses: anchore/scan-action@v3
        with:
          image: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          fail-build: false
          severity-cutoff: high
      
      # -------------------------------------------------------------------------
      # 9. 输出构建信息
      # -------------------------------------------------------------------------
      - name: 📊 Build Summary
        run: |
          echo "## 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** ${{ steps.meta.outputs.build_date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Quick Start" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "docker run -it --rm ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Docker Hub](https://hub.docker.com/r/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Job 2: 更新 Docker Hub 描述
  # =============================================================================
  update-docker-hub:
    name: Update Docker Hub Description
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 📝 Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./containers/README.md

